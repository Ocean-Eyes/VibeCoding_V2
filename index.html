const canvas=document.querySelector('#dust'),ctx=canvas.getContext('2d'),scene=document.querySelector('.scene');let w=0,h=0,dpr=1,particles=[],running=true,frame=0,last=0,clock=0;const pointer={x:-9999,y:-9999};let seed=921;function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}function resize(){const box=scene.getBoundingClientRect();w=box.width;h=box.height;dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed=921;particles=Array.from({length:Math.min(280,Math.max(95,Math.round(w*h/4700)))},()=>({x:random()*w,y:random()*h,depth:.2+random()*.8,size:.45+random()*1.45,speed:18+random()*42,phase:random()*Math.PI*2,warm:random()>.78,dx:0,dy:0}));draw(0);}

function tick(now){frame=0;if(!running||document.hidden)return;const dt=last?Math.min(.04,(now-last)/1000):0;last=now;draw(dt);frame=requestAnimationFrame(tick);}function sync(){window.dojoVfx.setEnabled(running);cancelAnimationFrame(frame);frame=0;last=0;if(running&&!document.hidden)frame=requestAnimationFrame(tick);else draw(0);}function renderStill(){if(!running&&w){light=lightTarget;draw(0);}}document.addEventListener('visibilitychange',sync);scene.addEventListener('pointermove',e=>{if(!running||e.pointerType==='touch')return;const b=scene.getBoundingClientRect();pointer.x=e.clientX-b.left;pointer.y=e.clientY-b.top;scene.style.setProperty('--shift',`${(pointer.x/w-.5)*40}px`);});scene.addEventListener('pointerleave',()=>{pointer.x=pointer.y=-9999;});new ResizeObserver(resize).observe(scene);window.addEventListener('pagehide',()=>cancelAnimationFrame(frame));window.addEventListener('pageshow',sync);chooseCourse(course);resize();sync();
