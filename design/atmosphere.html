<script type="module" src="./ink-shader.js"></script><script src="./dojo-vfx.js"></script><script>
const catalog={basics:[['띠 매는 법','OBI','매듭 시연을 보고 띠 매는 순서를 따라 합니다.'],['배밀기','BAEMILGI','가로 카메라로 자세를 확인하고 배밀기를 연습합니다.'],['낙법','UKEMI','낙법 기초 · 준비 중']],katame:[['십자조르기','NAMI-JUJI-JIME','목표 손 모양과 위치를 따라 합니다.'],['팔얽어비틀기','UDE-GARAMI','손목 잡기, 팔 연결, 들어 올리기를 순서대로 연습합니다.'],['곁누르기','KESA-GATAME','3D 시연을 보고 화면 우측 하단의 자세를 따라 합니다.']],throws:[['밭다리 후리기','O-SOTO-GARI','초기자세부터 세 단계 동작을 따라 합니다.'],['안다리 후리기','O-UCHI-GARI','3D 시연으로 동작의 흐름을 확인합니다.'],['한팔 업어치기','IPPON-SEOI-NAGE','3D 시연으로 몸의 회전과 동작을 확인합니다.']]};
let course='katame',selected=0,lightTarget=.62,light=.62;const courseButtons=[...document.querySelectorAll('[data-course]')],dialog=document.querySelector('dialog');function chooseLesson(i){selected=i;const item=catalog[course][i];document.querySelector('#lesson-title').textContent=item[0];document.querySelector('#lesson-roman').textContent=item[1];document.querySelector('#description').textContent=item[2];document.querySelector('#lesson-index').textContent=`0${i+1} / 03`;document.querySelectorAll('[data-lesson]').forEach((b,j)=>{b.classList.toggle('selected',i===j);b.setAttribute('aria-current',i===j?'true':'false');});lightTarget=.53+i*.10;renderStill();}function chooseCourse(c){course=c;courseButtons.forEach(b=>{b.classList.toggle('active',b.dataset.course===c);b.setAttribute('aria-current',b.dataset.course===c?'true':'false')});document.querySelector('#group').textContent={basics:'기초',katame:'굳히기본',throws:'메치기본'}[c];document.querySelector('#tech-list').innerHTML=catalog[c].map((v,i)=>`<button data-lesson="${i}">${v[0]}<span>${v[1]}</span></button>`).join('');document.querySelectorAll('[data-lesson]').forEach((b,i)=>b.onclick=()=>chooseLesson(i));chooseLesson(0);}
courseButtons.forEach(b=>b.onclick=()=>chooseCourse(b.dataset.course));function preview(title){document.querySelector('#preview-title').textContent=title;document.querySelector('#preview-mode').textContent='3D 시연 영역';document.querySelector('.target').hidden=true;document.querySelector('#switch-view').textContent='연습 화면 보기';dialog.showModal();}document.querySelector('#start').onclick=()=>preview(catalog[course][selected][0]);document.querySelector('#camera').onclick=()=>preview('스마트폰 카메라 연결');document.querySelector('.close').onclick=()=>dialog.close();document.querySelector('#switch-view').onclick=function(){const t=document.querySelector('.target');t.hidden=!t.hidden;document.querySelector('#preview-mode').textContent=t.hidden?'3D 시연 영역':'카메라 영상 영역';this.textContent=t.hidden?'연습 화면 보기':'시연 화면 보기';};document.querySelectorAll('nav').forEach(nav=>nav.addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','ArrowRight','ArrowLeft'].includes(e.key))return;const buttons=[...nav.querySelectorAll('button')];const i=buttons.indexOf(document.activeElement);if(i<0)return;e.preventDefault();const next=buttons[(i+(['ArrowDown','ArrowRight'].includes(e.key)?1:-1)+buttons.length)%buttons.length];next.focus();next.click();}));
const canvas=document.querySelector('#dust'),ctx=canvas.getContext('2d'),scene=document.querySelector('.scene'),reduce=matchMedia('(prefers-reduced-motion: reduce)'),toggle=document.querySelector('#motion');let w=0,h=0,dpr=1,particles=[],running=!reduce.matches,frame=0,last=0,clock=0;const pointer={x:-9999,y:-9999};let seed=921;function random(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646;}function resize(){const box=scene.getBoundingClientRect();w=box.width;h=box.height;dpr=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);seed=921;particles=Array.from({length:Math.min(280,Math.max(95,Math.round(w*h/4700)))},()=>({x:random()*w,y:random()*h,depth:.2+random()*.8,size:.45+random()*1.45,speed:18+random()*42,phase:random()*Math.PI*2,warm:random()>.78,dx:0,dy:0}));draw(0);}
function draw(dt){clock+=dt;window.inkShader?.draw(clock,pointer,lightTarget,running);light+=(lightTarget-light)*Math.min(1,dt*2);ctx.clearRect(0,0,w,h);const bloom=ctx.createRadialGradient(w*light,h*.37,0,w*light,h*.37,w*.58);bloom.addColorStop(0,'rgba(88,105,113,.13)');bloom.addColorStop(.5,'rgba(58,72,81,.045)');bloom.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bloom;ctx.fillRect(0,0,w,h);window.dojoVfx.draw(ctx,w,h,dt,particles);for(const p of particles){if(dt){p.x+=(.28+Math.sin(clock*.35+p.phase)*.8)*p.speed*dt;p.y-=p.speed*dt*(.45+p.depth*.6);const dx=p.x-pointer.x,dy=p.y-pointer.y,dist=Math.hypot(dx,dy);if(dist<145&&dist>1){const force=(1-dist/145)*45*p.depth;p.dx+=(dx/dist)*force*dt;p.dy+=(dy/dist)*force*dt;}p.dx*=Math.exp(-dt*2.7);p.dy*=Math.exp(-dt*2.7);if(p.y< -20)p.y=h+20;if(p.x< -20)p.x=w+20;if(p.x>w+20)p.x=-20;}const x=p.x+p.dx,y=p.y+p.dy,illumination=Math.max(.12,1-Math.abs(x/w-light)*1.05),alpha=(.14+p.depth*.40)*illumination*(.78+.22*Math.sin(clock*.45+p.phase));ctx.fillStyle=p.warm?`rgba(220,163,109,${alpha})`:`rgba(201,215,217,${alpha})`;if(p.depth>.88){const glow=ctx.createRadialGradient(x,y,0,x,y,p.size*5);glow.addColorStop(0,p.warm?'rgba(207,138,81,.12)':'rgba(191,213,223,.10)');glow.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(x,y,p.size*5,0,Math.PI*2);ctx.fill();ctx.fillStyle=p.warm?`rgba(235,180,131,${alpha})`:`rgba(211,225,227,${alpha})`;}ctx.beginPath();ctx.ellipse(x,y,p.size*p.depth,p.size*p.depth*1.45,.5,0,Math.PI*2);ctx.fill();}canvas.dataset.time=clock.toFixed(3);}
function tick(now){frame=0;if(!running||document.hidden)return;const dt=last?Math.min(.04,(now-last)/1000):0;last=now;draw(dt);frame=requestAnimationFrame(tick);}function sync(){window.dojoVfx.setEnabled(running);cancelAnimationFrame(frame);frame=0;last=0;toggle.textContent=running?'VFX ON':'VFX OFF · 재생';toggle.setAttribute('aria-pressed',String(running));if(running&&!document.hidden)frame=requestAnimationFrame(tick);else draw(0);}function renderStill(){if(!running&&w){light=lightTarget;draw(0);}}toggle.onclick=()=>{running=!running;sync();};reduce.addEventListener('change',()=>{running=!reduce.matches;sync();});document.addEventListener('visibilitychange',sync);scene.addEventListener('pointermove',e=>{if(!running||e.pointerType==='touch')return;const b=scene.getBoundingClientRect();pointer.x=e.clientX-b.left;pointer.y=e.clientY-b.top;scene.style.setProperty('--shift',`${(pointer.x/w-.5)*40}px`);});scene.addEventListener('pointerleave',()=>{pointer.x=pointer.y=-9999;});new ResizeObserver(resize).observe(scene);window.addEventListener('pagehide',()=>cancelAnimationFrame(frame));chooseCourse(course);resize();sync();
</script></body></html>
